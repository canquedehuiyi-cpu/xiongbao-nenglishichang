<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="全栈开发组">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="0.55" stop-color="#0d4f9e"/>
      <stop offset="1" stop-color="#0a3a73"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd1ff"/>
      <stop offset="1" stop-color="#9b8cff"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="92" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.55"/>
  <!-- stacked layers = fullstack -->
  <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.96">
    <path d="M66 104 L128 70 L190 104"/>
    <path d="M66 134 L128 100 L190 134"/>
    <path d="M66 164 L128 130 L190 164"/>
  </g>
  <circle cx="128" cy="70" r="9" fill="#ffffff"/>
  <!-- gear hint for team/ops -->
  <g fill="#9b8cff" opacity="0.9">
    <circle cx="190" cy="190" r="16"/>
    <rect x="186" y="166" width="8" height="10" rx="2"/>
    <rect x="186" y="204" width="8" height="10" rx="2"/>
    <rect x="166" y="186" width="10" height="8" rx="2"/>
    <rect x="204" y="186" width="10" height="8" rx="2"/>
  </g>
  <text x="128" y="236" font-family="-apple-system, Segoe UI, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">全栈组</text>
</svg>
