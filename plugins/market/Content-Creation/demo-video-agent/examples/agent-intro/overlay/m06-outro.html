<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>m06 · 片尾</title>
<link rel="stylesheet" href="base.css">
<style>
  .aurora {
    position: absolute; inset: -30%; opacity: .7; filter: blur(70px);
    background: conic-gradient(from 90deg at 50% 50%, transparent, rgba(56,189,248,.13), transparent 28%, rgba(129,140,248,.12), transparent 62%, rgba(52,211,153,.07), transparent);
  }
  body.playing .aurora { animation: auroraSpin 18s linear infinite; animation-delay: calc(0s - var(--delta)); }
  @keyframes auroraSpin { to { transform: rotate(360deg); } }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.62)); z-index: 3; }
  .scanlines {
    position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: .14;
    background: repeating-linear-gradient(180deg, transparent 0, transparent 3px, rgba(125,211,252,.04) 4px);
  }
  .halo {
    position: absolute; left: 50%; top: 47%; width: 720px; height: 720px;
    transform: translate(-50%,-50%); border-radius: 50%; opacity: 0;
    border: 1px solid rgba(56,189,248,.16);
    box-shadow: 0 0 100px rgba(56,189,248,.06), inset 0 0 100px rgba(129,140,248,.04);
  }
  .halo::before, .halo::after {
    content: ""; position: absolute; border-radius: 50%; border: 1px dashed rgba(129,140,248,.2);
  }
  .halo::before { inset: 74px; }
  .halo::after { inset: 154px; border-style: solid; border-color: rgba(56,189,248,.12); }
  body.playing .halo { animation: haloIn 1.4s ease both, haloPulse 4s ease-in-out 1.4s infinite; animation-delay: calc(.2s - var(--delta)), calc(1.6s - var(--delta)); }
  @keyframes haloIn { from { opacity: 0; transform: translate(-50%,-50%) scale(.55); } to { opacity: 1; transform: translate(-50%,-50%) scale(1); } }
  @keyframes haloPulse { 50% { box-shadow: 0 0 140px rgba(56,189,248,.12), inset 0 0 120px rgba(129,140,248,.07); } }
  .corner {
    position: absolute; z-index: 5; width: 92px; height: 92px; opacity: 0;
    border-color: rgba(125,211,252,.45); border-style: solid; border-width: 0;
  }
  .c1 { left: 64px; top: 58px; border-left-width: 1px; border-top-width: 1px; }
  .c2 { right: 64px; top: 58px; border-right-width: 1px; border-top-width: 1px; }
  .c3 { left: 64px; bottom: 58px; border-left-width: 1px; border-bottom-width: 1px; }
  .c4 { right: 64px; bottom: 58px; border-right-width: 1px; border-bottom-width: 1px; }
  body.playing .corner { animation: cornerIn .9s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(.25s - var(--delta)); }
  @keyframes cornerIn { from { opacity: 0; transform: scale(1.8); } to { opacity: 1; transform: none; } }
  .spark {
    position: absolute; z-index: 2; left: var(--x); top: var(--y); width: 2px; height: 2px;
    border-radius: 50%; background: #e0f2fe; box-shadow: 0 0 14px #38bdf8; opacity: 0;
  }
  body.playing .spark { animation: spark 4.8s ease-in-out infinite; animation-delay: calc(var(--d) - var(--delta)); }
  @keyframes spark { 0%,100% { opacity: 0; transform: scale(.4); } 45%,60% { opacity: 1; transform: scale(1.8); } }
  .topline {
    position: absolute; z-index: 7; left: 90px; right: 90px; top: 76px;
    display: flex; justify-content: space-between;
    font-family: var(--mono); font-size: 13px; letter-spacing: 4px; color: #526a86;
  }
  .topline .done { color: #86efac; }
  .wrap {
    position: absolute; inset: 0; z-index: 6;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding-bottom: 12px;
  }
  .badge {
    display: flex; align-items: center; gap: 12px; padding: 10px 23px; border-radius: 999px;
    border: 1px solid rgba(52,211,153,.32); background: rgba(6,20,20,.72);
    box-shadow: 0 0 32px rgba(52,211,153,.07);
    font-family: var(--mono); font-size: 14px; letter-spacing: 4px; color: #a7f3d0;
  }
  .badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 14px var(--ok); }
  h1 {
    font-size: 68px; font-weight: 680; letter-spacing: 4px; line-height: 1.2;
    background: linear-gradient(105deg, #f0f9ff, #7dd3fc 44%, #c4b5fd 74%, #f0f9ff);
    background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 12px 30px rgba(56,189,248,.13));
  }
  body.playing h1.anim {
    animation: rise .9s cubic-bezier(.2,.75,.2,1) forwards, sheen 6s linear 1.3s infinite;
    animation-delay: calc(var(--d) - var(--delta)), calc(1.3s - var(--delta));
  }
  @keyframes sheen { to { background-position: 220% 0; } }
  .cmd {
    position: relative; width: 1160px; height: 96px; margin-top: 12px;
    display: flex; align-items: center; gap: 14px; padding: 0 34px;
    border-radius: 16px; border: 1px solid rgba(56,189,248,.42);
    background: linear-gradient(180deg, rgba(14,28,47,.96), rgba(6,13,24,.96));
    box-shadow: 0 30px 80px rgba(0,0,0,.5), 0 0 50px rgba(56,189,248,.08), inset 0 1px rgba(224,242,254,.04);
    font-family: var(--mono); font-size: 27px; overflow: hidden;
  }
  .cmd::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 180px; left: -220px;
    background: linear-gradient(90deg, transparent, rgba(125,211,252,.12), transparent);
    transform: skewX(-18deg);
  }
  body.playing .cmd::after { animation: cmdSweep 3.8s ease-in-out 1.5s infinite; }
  @keyframes cmdSweep { 0% { left: -220px; } 65%,100% { left: 1250px; } }
  .cmd .slash { color: #38bdf8; }
  .cmd .name { color: #eaf6ff; font-weight: 600; }
  .cmd .arg { color: #93a8c2; font-size: 23px; margin-left: 6px; }
  .cmd .caret { width: 11px; height: 30px; border-radius: 2px; background: #38bdf8; margin-left: auto; box-shadow: 0 0 14px rgba(56,189,248,.5); }
  body.playing .cmd .caret { animation: blink 1.05s steps(1) infinite 1.5s; }
  @keyframes blink { 50% { opacity: 0; } }
  .steps { display: flex; align-items: center; gap: 16px; margin-top: 18px; }
  .step {
    min-width: 126px; padding: 13px 18px; text-align: center; border-radius: 10px;
    border: 1px solid rgba(148,163,184,.2); background: rgba(9,17,30,.85);
    font-size: 18px; letter-spacing: 3px; color: #c8d8eb;
  }
  .arrow { color: #38516d; font-size: 17px; }
  .sig {
    margin-top: 24px; text-align: center; font-family: var(--mono); font-size: 15px;
    line-height: 2; letter-spacing: 2px; color: #6f839d;
  }
  .sig b { color: #bae6fd; font-weight: 500; }
  .sig .seal { color: #86efac; }
  .bottomline {
    position: absolute; z-index: 7; left: 90px; right: 90px; bottom: 74px;
    display: flex; align-items: center; gap: 24px;
    font-family: var(--mono); font-size: 12px; letter-spacing: 3px; color: #465e79;
  }
  .bottomline .line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(56,189,248,.34), transparent); }
</style>
</head>
<body>
<div class="stage">
  <div class="grid-bg"></div>
  <div class="aurora"></div>
  <div class="halo"></div>
  <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
  <i class="spark" style="--x:14%;--y:24%;--d:.2s"></i><i class="spark" style="--x:23%;--y:76%;--d:1.8s"></i>
  <i class="spark" style="--x:33%;--y:17%;--d:3s"></i><i class="spark" style="--x:72%;--y:20%;--d:1.1s"></i>
  <i class="spark" style="--x:83%;--y:72%;--d:2.4s"></i><i class="spark" style="--x:91%;--y:35%;--d:.7s"></i>
  <div class="scanlines"></div><div class="vignette"></div>

  <div class="topline anim" style="--d:.25s"><span>DEMO VIDEO AGENT / FINAL FRAME</span><span class="done">● RENDER COMPLETE</span></div>

  <div class="wrap">
    <div class="badge anim" style="--d:.4s"><i></i>YOUR NEXT STORY STARTS HERE</div>
    <h1 class="anim" style="--d:.65s">开始你的下一条演示视频</h1>

    <div class="cmd anim" style="--d:1s">
      <span class="slash">/</span><span class="name">demo-video</span>
      <span class="arg">描述想演示的系统</span><span class="caret"></span>
    </div>

    <div class="steps">
      <div class="step anim" style="--d:6s">策划</div><span class="arrow anim" style="--d:6.2s">→</span>
      <div class="step anim" style="--d:6.8s">配音</div><span class="arrow anim" style="--d:7s">→</span>
      <div class="step anim" style="--d:7.6s">录制</div><span class="arrow anim" style="--d:7.8s">→</span>
      <div class="step anim" style="--d:8.5s">合成</div><span class="arrow anim" style="--d:8.7s">→</span>
      <div class="step anim" style="--d:9.5s">验收</div>
    </div>

    <div class="sig anim" style="--d:11.6s">
      本视频由 <b>demo-video-agent</b> 策划、录制、合成并完成验收<br>
      <span class="seal">✓ 7 SCENES VERIFIED</span> · QODER PLUGIN V0.5.0
    </div>
  </div>

  <div class="bottomline anim" style="--d:12s"><span>WRITE THE STORY</span><span class="line"></span><span>SHIP THE VIDEO</span></div>
</div>
<div id="veil"></div>
</body>
</html>
