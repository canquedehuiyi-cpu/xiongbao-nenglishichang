<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>m00 · 片头</title>
<link rel="stylesheet" href="base.css">
<style>
  .vignette {
    position: absolute; inset: 0; z-index: 8; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,.58) 100%);
  }
  .scanlines {
    position: absolute; inset: 0; z-index: 7; pointer-events: none; opacity: .16;
    background: repeating-linear-gradient(180deg, transparent 0, transparent 3px, rgba(125,211,252,.045) 4px);
  }
  .light-beam {
    position: absolute; z-index: 1; left: -30%; top: -45%; width: 32%; height: 190%;
    background: linear-gradient(90deg, transparent, rgba(56,189,248,.055), rgba(165,180,252,.11), transparent);
    transform: rotate(24deg); filter: blur(12px); opacity: 0;
  }
  body.playing .light-beam {
    animation: beam 7.5s ease-in-out infinite;
    animation-delay: calc(.2s - var(--delta));
  }
  @keyframes beam {
    0% { left: -35%; opacity: 0; }
    18% { opacity: 1; }
    70% { opacity: .75; }
    100% { left: 120%; opacity: 0; }
  }
  .orbit-system {
    position: absolute; left: 50%; top: 48%; width: 820px; height: 820px;
    transform: translate(-50%,-50%) rotateX(64deg); transform-style: preserve-3d;
  }
  .ring {
    position: absolute; border-radius: 50%; opacity: 0;
    border: 1px solid rgba(56,189,248,.22);
    box-shadow: inset 0 0 40px rgba(56,189,248,.025), 0 0 40px rgba(56,189,248,.025);
  }
  .ring::before, .ring::after {
    content: ""; position: absolute; width: 9px; height: 9px; border-radius: 50%;
    background: #7dd3fc; box-shadow: 0 0 20px #38bdf8, 0 0 44px rgba(56,189,248,.6);
  }
  .ring::before { left: 12%; top: 12%; }
  .ring::after { right: 8%; bottom: 22%; background: #a5b4fc; box-shadow: 0 0 20px #818cf8; }
  .r1 { inset: 70px; border-style: dashed; }
  .r2 { inset: 150px; border-color: rgba(129,140,248,.28); }
  .r3 { inset: 232px; border-color: rgba(125,211,252,.16); }
  body.playing .r1 { animation: ringOn 1s ease both, spin 24s linear 1s infinite; animation-delay: calc(.1s - var(--delta)), calc(1.1s - var(--delta)); }
  body.playing .r2 { animation: ringOn 1s ease both, spinReverse 19s linear 1s infinite; animation-delay: calc(.25s - var(--delta)), calc(1.25s - var(--delta)); }
  body.playing .r3 { animation: ringOn 1s ease both, spin 13s linear 1s infinite; animation-delay: calc(.4s - var(--delta)), calc(1.4s - var(--delta)); }
  @keyframes ringOn { to { opacity: .8; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spinReverse { to { transform: rotate(-360deg); } }
  .particle {
    position: absolute; z-index: 2; left: var(--x); top: var(--y); width: 3px; height: 3px;
    border-radius: 50%; background: #bae6fd; box-shadow: 0 0 12px #38bdf8; opacity: 0;
  }
  body.playing .particle {
    animation: particle var(--t, 5s) ease-in-out infinite;
    animation-delay: calc(var(--d, 0s) - var(--delta));
  }
  @keyframes particle {
    0%,100% { opacity: 0; transform: translateY(22px) scale(.5); }
    35%,65% { opacity: .85; transform: translateY(-18px) scale(1); }
  }
  .topline {
    position: absolute; z-index: 10; left: 76px; right: 76px; top: 54px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--mono); font-size: 14px; letter-spacing: 4px; color: #526a86;
  }
  .topline .live { display: flex; align-items: center; gap: 12px; color: #7dd3fc; }
  .topline .live i { width: 7px; height: 7px; border-radius: 50%; background: #38bdf8; box-shadow: 0 0 16px #38bdf8; }
  .hero {
    position: absolute; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; padding-bottom: 22px;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 14px;
    padding: 11px 25px; border-radius: 999px;
    border: 1px solid rgba(56,189,248,.34); background: rgba(5,12,24,.72);
    box-shadow: 0 0 34px rgba(56,189,248,.08), inset 0 0 20px rgba(56,189,248,.045);
    font-family: var(--mono); font-size: 15px; letter-spacing: 4px; color: #a5f3fc;
    backdrop-filter: blur(10px);
  }
  .badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 14px var(--ok); }
  h1 {
    position: relative; font-size: 110px; font-weight: 720; letter-spacing: 7px; line-height: 1.12;
    background: linear-gradient(105deg, #f0f9ff 5%, #7dd3fc 34%, #c4b5fd 62%, #f0f9ff 92%);
    background-size: 240% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 12px 34px rgba(56,189,248,.15));
  }
  body.playing h1.anim {
    animation: rise .95s cubic-bezier(.2,.75,.2,1) forwards, sheen 6s linear 1.4s infinite;
    animation-delay: calc(var(--d) - var(--delta)), calc(1.4s - var(--delta));
  }
  @keyframes sheen { to { background-position: 240% 0; } }
  .english { font-family: var(--mono); font-size: 16px; letter-spacing: 10px; color: #607b9a; }
  .flow { display: flex; align-items: center; gap: 14px; margin-top: 32px; }
  .flow .item {
    position: relative; min-width: 124px; padding: 14px 20px; text-align: center;
    border: 1px solid rgba(148,163,184,.2); border-radius: 10px;
    background: linear-gradient(180deg, rgba(17,29,48,.88), rgba(7,13,24,.88));
    box-shadow: 0 16px 34px rgba(0,0,0,.28); font-size: 20px; letter-spacing: 3px; color: #cbdaf0;
  }
  .flow .item::after {
    content: ""; position: absolute; left: 18px; right: 18px; bottom: -1px; height: 1px;
    background: linear-gradient(90deg, transparent, #38bdf8, transparent); opacity: .65;
  }
  .flow .sep { color: #38516d; font-size: 20px; }
  .lead { margin-top: 8px; font-size: 27px; letter-spacing: 4px; color: #a5b7cf; }
  .lead b { color: #e0f2fe; font-weight: 550; }
  .sig {
    position: absolute; z-index: 10; bottom: 58px; left: 76px; right: 76px;
    display: flex; justify-content: space-between;
    font-family: var(--mono); font-size: 13px; letter-spacing: 2px; color: #465e79;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="grid-bg"></div>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>
  <div class="light-beam"></div>
  <div class="orbit-system">
    <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
  </div>
  <i class="particle" style="--x:12%;--y:28%;--d:.3s;--t:5.2s"></i>
  <i class="particle" style="--x:20%;--y:72%;--d:1.1s;--t:6.4s"></i>
  <i class="particle" style="--x:29%;--y:18%;--d:2.2s;--t:5.8s"></i>
  <i class="particle" style="--x:35%;--y:82%;--d:.8s;--t:7s"></i>
  <i class="particle" style="--x:68%;--y:16%;--d:1.7s;--t:6.1s"></i>
  <i class="particle" style="--x:76%;--y:78%;--d:2.8s;--t:5.4s"></i>
  <i class="particle" style="--x:86%;--y:32%;--d:.5s;--t:6.8s"></i>
  <i class="particle" style="--x:91%;--y:64%;--d:1.9s;--t:5.6s"></i>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <div class="topline anim" style="--d:.25s">
    <span>QODER / GENERATIVE STUDIO</span><span class="live"><i></i>PIPELINE ONLINE</span>
  </div>

  <div class="hero">
    <div class="badge anim" style="--d:.4s"><i></i>DEMO VIDEO AGENT · V0.5.0</div>
    <h1 class="anim" style="--d:.7s">演示视频 Agent</h1>
    <div class="english anim" style="--d:1.1s">FROM NARRATION TO MOTION</div>
    <div class="flow">
      <span class="item anim" style="--d:4.65s">写稿</span><span class="sep anim" style="--d:4.85s">→</span>
      <span class="item anim" style="--d:5.35s">配音</span><span class="sep anim" style="--d:5.55s">→</span>
      <span class="item anim" style="--d:6.15s">录屏</span><span class="sep anim" style="--d:6.35s">→</span>
      <span class="item anim" style="--d:7.1s">合成</span><span class="sep anim" style="--d:7.3s">→</span>
      <span class="item anim" style="--d:8.2s">验收</span>
    </div>
    <p class="lead anim" style="--d:10.7s">你负责表达价值，<b>它负责呈现在屏幕上</b></p>
  </div>

  <div class="sig anim" style="--d:11.2s">
    <span>NARRATION.MD → MP3 + VTT → WEBM → MP4</span><span>1920 × 1080 / 25 FPS</span>
  </div>
</div>
<div id="veil"></div>
</body>
</html>
