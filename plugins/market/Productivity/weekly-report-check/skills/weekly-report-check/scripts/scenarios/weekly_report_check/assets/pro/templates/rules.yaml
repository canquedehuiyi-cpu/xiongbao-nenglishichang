# 展示层文案与判定数据面：标题、节名清单、期限词表、交付物词表。
# 判定阈值与节识别逻辑在场景包 code/_core.py 顶部常量——判定权归代码。
#
# 用户单位的周报节名/期限说法/交付物说法对不上时，直接在本文件加词即可，不改代码。
title: "周报体检报告"
section_label: "FINDINGS"
# 节名清单：行是「待办类」还是「进展类」由命中哪个清单决定
todo_sections: ["下周计划", "下周安排", "后续计划", "待办", "待办事项", "计划"]
progress_sections: ["本周工作", "本周进展", "工作进展", "进展", "完成情况", "本周完成", "工作内容", "本周总结"]
# 期限说法（待办行内出现任一即算有期限）
deadline_words: ["周内", "本周内", "月底", "之前", "截止", "底前", "下班前", "前完成"]
# 交付物名词（进展句内出现任一即算有实物）
deliverable_words: ["文档", "方案", "表", "代码", "上线", "发布", "会议", "报告", "版本", "清单", "需求", "系统", "数据", "客户", "合同", "订单", "项目"]

# 报告页脚(品牌获客位,单点配置):品牌名定稿后只改这里
footer: "本报告由 <品牌名待定> 判定引擎生成,每个结论可手验。同厂出品:PPT 内容核对 / 简历制作"
