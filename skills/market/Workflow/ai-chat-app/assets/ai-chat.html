<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 对话</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; }

#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

/* header */
#header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a;
  min-height: 56px;
}
#header h1 { font-size: 17px; font-weight: 600; color: #fff; }
#headerBtn {
  background: none; border: none; color: #aaa; font-size: 22px; padding: 4px 8px;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}

/* chat area */
#chat {
  flex: 1; overflow-y: auto; padding: 16px;
  -webkit-overflow-scrolling: touch;
}
.msg { margin-bottom: 16px; display: flex; }
.msg.user { justify-content: flex-end; }
.msg.ai { justify-content: flex-start; }
.bubble {
  max-width: 82%; padding: 12px 16px; border-radius: 18px;
  font-size: 15px; line-height: 1.6; word-break: break-word;
  white-space: pre-wrap;
}
.msg.user .bubble {
  background: #2563eb; color: #fff;
  border-bottom-right-radius: 6px;
}
.msg.ai .bubble {
  background: #1e1e1e; color: #e0e0e0;
  border-bottom-left-radius: 6px;
}
.msg.ai .bubble.error { color: #f87171; }
.msg.ai .bubble .typing { display: inline-block; }
.msg.ai .bubble .typing span {
  display: inline-block; width: 6px; height: 6px;
  background: #888; border-radius: 50%; margin: 0 2px;
  animation: blink 1.4s infinite both;
}
.msg.ai .bubble .typing span:nth-child(2) { animation-delay: 0.2s; }
.msg.ai .bubble .typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100% { opacity: 0.3; } 40% { opacity: 1; } }

/* input area */
#inputArea {
  display: flex; align-items: flex-end; gap: 8px;
  padding: 10px 12px; background: #1a1a1a; border-top: 1px solid #2a2a2a;
}
#msgInput {
  flex: 1; border: 1px solid #333; border-radius: 20px;
  background: #252525; color: #fff; font-size: 15px;
  padding: 10px 16px; resize: none; outline: none;
  max-height: 120px; min-height: 42px; line-height: 1.4;
  font-family: inherit;
}
#msgInput:focus { border-color: #2563eb; }
#sendBtn {
  width: 42px; height: 42px; border-radius: 50%;
  background: #2563eb; border: none; color: #fff;
  font-size: 20px; cursor: pointer; flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  display: flex; align-items: center; justify-content: center;
}
#sendBtn:disabled { background: #444; }
#sendBtn:active:not(:disabled) { transform: scale(0.92); }

/* settings panel */
#settings {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6); z-index: 100;
  display: none;
}
#settings.show { display: block; }
#settingsBox {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: #1a1a1a; border-radius: 16px 16px 0 0;
  padding: 20px 16px 30px; max-height: 80vh; overflow-y: auto;
}
#settingsBox h2 { font-size: 18px; color: #fff; margin-bottom: 16px; text-align: center; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; color: #888; margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 10px 12px; border: 1px solid #333;
  border-radius: 10px; background: #252525; color: #fff;
  font-size: 14px; outline: none; font-family: inherit;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: #2563eb; }
.field textarea { resize: vertical; min-height: 60px; }
#saveBtn {
  width: 100%; padding: 12px; border: none; border-radius: 12px;
  background: #2563eb; color: #fff; font-size: 16px; font-weight: 600;
  cursor: pointer; margin-top: 8px;
  -webkit-tap-highlight-color: transparent;
}
#saveBtn:active { transform: scale(0.98); }
.closeBtn {
  display: block; margin: 12px auto 0; background: none;
  border: none; color: #888; font-size: 15px; cursor: pointer;
}

/* welcome */
#welcome {
  text-align: center; padding: 60px 20px; color: #666;
}
#welcome h2 { font-size: 22px; color: #aaa; margin-bottom: 8px; }
#welcome p { font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <button id="headerBtn" onclick="clearChat()" style="visibility:hidden">🗑</button>
    <h1>AI 对话</h1>
    <button id="headerBtn" onclick="openSettings()">⚙</button>
  </div>

  <div id="chat">
    <div id="welcome">
      <h2>你好 👋</h2>
      <p>点击右上角 ⚙ 配置 API 地址和密钥<br>然后就可以开始对话了</p>
    </div>
  </div>

  <div id="inputArea">
    <textarea id="msgInput" rows="1" placeholder="输入消息..."></textarea>
    <button id="sendBtn" onclick="sendMsg()">➤</button>
  </div>
</div>

<div id="settings">
  <div id="settingsBox">
    <h2>⚙ API 设置</h2>
    <div class="field">
      <label>API 地址</label>
      <input id="cfgUrl" placeholder="https://api.openai.com/v1/chat/completions">
    </div>
    <div class="field">
      <label>API Key</label>
      <input id="cfgKey" type="password" placeholder="sk-...">
    </div>
    <div class="field">
      <label>模型名称</label>
      <input id="cfgModel" placeholder="gpt-3.5-turbo">
    </div>
    <div class="field">
      <label>系统提示词（可选）</label>
      <textarea id="cfgSystem" placeholder="你是一个有用的助手..."></textarea>
    </div>
    <button id="saveBtn" onclick="saveSettings()">保存</button>
    <button class="closeBtn" onclick="closeSettings()">取消</button>
  </div>
</div>

<script>
(function(){
  var chatEl = document.getElementById('chat');
  var inputEl = document.getElementById('msgInput');
  var sendBtn = document.getElementById('sendBtn');
  var welcomeEl = document.getElementById('welcome');
  var settingsEl = document.getElementById('settings');

  var messages = [];
  var busy = false;

  // load settings
  function loadCfg() {
    return {
      url: localStorage.getItem('ai_url') || '',
      key: localStorage.getItem('ai_key') || '',
      model: localStorage.getItem('ai_model') || 'gpt-3.5-turbo',
      system: localStorage.getItem('ai_system') || ''
    };
  }

  // auto-fill settings
  var cfg = loadCfg();
  document.getElementById('cfgUrl').value = cfg.url;
  document.getElementById('cfgKey').value = cfg.key;
  document.getElementById('cfgModel').value = cfg.model;
  document.getElementById('cfgSystem').value = cfg.system;

  window.openSettings = function() { settingsEl.classList.add('show'); };
  window.closeSettings = function() { settingsEl.classList.remove('show'); };

  window.saveSettings = function() {
    var url = document.getElementById('cfgUrl').value.trim();
    var key = document.getElementById('cfgKey').value.trim();
    var model = document.getElementById('cfgModel').value.trim();
    var system = document.getElementById('cfgSystem').value.trim();
    localStorage.setItem('ai_url', url);
    localStorage.setItem('ai_key', key);
    localStorage.setItem('ai_model', model);
    localStorage.setItem('ai_system', system);
    settingsEl.classList.remove('show');
    addMsg('ai', '设置已保存 ✅');
  };

  window.clearChat = function() {
    if (messages.length === 0) return;
    messages = [];
    chatEl.innerHTML = '<div id="welcome"><h2>你好 👋</h2><p>点击右上角 ⚙ 配置 API 地址和密钥<br>然后就可以开始对话了</p></div>';
  };

  function addMsg(role, text, isError) {
    if (welcomeEl) welcomeEl.style.display = 'none';
    var div = document.createElement('div');
    div.className = 'msg ' + role;
    var bubble = document.createElement('div');
    bubble.className = 'bubble' + (isError ? ' error' : '');
    bubble.textContent = text;
    div.appendChild(bubble);
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return bubble;
  }

  function addTyping() {
    if (welcomeEl) welcomeEl.style.display = 'none';
    var div = document.createElement('div');
    div.className = 'msg ai';
    div.id = 'typingMsg';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    div.appendChild(bubble);
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return bubble;
  }

  function removeTyping() {
    var el = document.getElementById('typingMsg');
    if (el) el.remove();
  }

  function autoResize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  }
  inputEl.addEventListener('input', autoResize);

  // send on Enter (not Shift+Enter)
  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMsg();
    }
  });

  window.sendMsg = function() {
    if (busy) return;
    var text = inputEl.value.trim();
    if (!text) return;

    var cfg = loadCfg();
    if (!cfg.url || !cfg.key) {
      addMsg('ai', '请先在设置中配置 API 地址和密钥 ⚙', true);
      return;
    }

    inputEl.value = '';
    autoResize();
    addMsg('user', text);
    messages.push({ role: 'user', content: text });

    busy = true;
    sendBtn.disabled = true;
    var typingBubble = addTyping();

    var body = {
      model: cfg.model,
      messages: [],
      stream: true
    };
    if (cfg.system) {
      body.messages.push({ role: 'system', content: cfg.system });
    }
    for (var i = 0; i < messages.length; i++) {
      body.messages.push(messages[i]);
    }

    var xhr = new XMLHttpRequest();
    xhr.open('POST', cfg.url, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.setRequestHeader('Authorization', 'Bearer ' + cfg.key);

    var fullText = '';
    var started = false;

    xhr.onreadystatechange = function() {
      if (xhr.readyState === 2) {
        // headers received
      }
    };

    xhr.onprogress = function() {
      var text = xhr.responseText;
      var lines = text.split('\n');
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (line.indexOf('data: ') === 0) {
          var data = line.substring(6);
          if (data === '[DONE]') continue;
          try {
            var json = JSON.parse(data);
            var delta = json.choices && json.choices[0] && json.choices[0].delta;
            if (delta && delta.content) {
              fullText += delta.content;
              if (!started) {
                started = true;
                typingBubble.textContent = '';
              }
              typingBubble.textContent = fullText;
              chatEl.scrollTop = chatEl.scrollHeight;
            }
          } catch(e) {}
        }
      }
    };

    xhr.onload = function() {
      removeTyping();
      if (xhr.status >= 200 && xhr.status < 300) {
        if (fullText) {
          addMsg('ai', fullText);
          messages.push({ role: 'assistant', content: fullText });
        } else {
          // try non-streaming response
          try {
            var json = JSON.parse(xhr.responseText);
            var content = json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content;
            if (content) {
              addMsg('ai', content);
              messages.push({ role: 'assistant', content: content });
            } else {
              addMsg('ai', '未获取到回复', true);
            }
          } catch(e) {
            addMsg('ai', '解析响应失败', true);
          }
        }
      } else {
        var errMsg = '请求失败 (' + xhr.status + ')';
        try {
          var errJson = JSON.parse(xhr.responseText);
          if (errJson.error && errJson.error.message) errMsg = errJson.error.message;
        } catch(e) {}
        addMsg('ai', errMsg, true);
      }
      busy = false;
      sendBtn.disabled = false;
      inputEl.focus();
    };

    xhr.onerror = function() {
      removeTyping();
      addMsg('ai', '网络错误，请检查 API 地址是否正确', true);
      busy = false;
      sendBtn.disabled = false;
    };

    xhr.send(JSON.stringify(body));
  };
})();
</script>
</body>
</html>
